name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-manual:
    name: Build Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended pandoc fonts-liberation librsvg2-bin

      - name: Build manual
        run: |
          cd doc
          pandoc NineStrip_Manual.md -o NineStrip_Manual.pdf --pdf-engine=xelatex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: doc/NineStrip_Manual.pdf

  build:
    name: Build ${{ matrix.name }}
    needs: build-manual
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: NineStrip-Linux.tar.gz
            cc: gcc
            cxx: g++

          - name: macOS
            os: macos-latest
            artifact: NineStrip-macOS.zip
            cc: clang
            cxx: clang++

          - name: Windows
            os: windows-latest
            artifact: NineStrip-Windows.zip
            cc: cl
            cxx: cl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download manual PDF
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: doc/

      # Clone VST3 SDK for validator
      - name: Clone VST3 SDK
        run: git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git

      # Install Ninja (all platforms)
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            gcc \
            g++

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      # Windows dependencies
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Build VST3 validator
      - name: Build VST3 Validator (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd vst3sdk
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          cmake --build build --target validator

      - name: Build VST3 Validator (Windows)
        if: runner.os == 'Windows'
        run: |
          cd vst3sdk
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          cmake --build build --config Release --target validator

      # CMake configuration
      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Build
      - name: Build
        run: ninja -C build

      # Run VST3 Validator with dynamic path finding
      - name: Validate VST3 (Linux)
        if: runner.os == 'Linux'
        run: |
          VALIDATOR=$(find vst3sdk/build -type f -name validator -executable | head -n 1)
          if [ -z "$VALIDATOR" ]; then
            echo "ERROR: validator not found"
            exit 1
          fi
          echo "Using validator: $VALIDATOR"
          $VALIDATOR build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 2>&1 | tee validator-linux.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          VALIDATOR=$(find vst3sdk/build -type f -name validator -perm +111 | head -n 1)
          if [ -z "$VALIDATOR" ]; then
            echo "ERROR: validator not found"
            exit 1
          fi
          echo "Using validator: $VALIDATOR"
          $VALIDATOR build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 2>&1 | tee validator-macos.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path "vst3sdk\build" -Recurse -Filter "validator.exe" | Select-Object -First 1
          if (-not $validator) {
            throw "validator.exe not found"
          }
          Write-Host "Using validator: $($validator.FullName)"
          $plugin = "build\src\NineStrip_artefacts\Release\VST3\NineStrip.vst3"
          & $validator.FullName $plugin 2>&1 | Tee-Object -FilePath "validator-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Upload validator logs
      - name: Upload validator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-log-${{ matrix.name }}
          path: validator-*.log

      - name: Download pluginval
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip pluginval_Linux.zip
          chmod +x pluginval

      - name: Download pluginval
        if: runner.os == 'macOS'
        run: |
          wget https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip pluginval_macOS.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval

      - name: Download pluginval
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile "pluginval.zip"
          Expand-Archive -Path pluginval.zip -DestinationPath .

      # Validate with pluginval
      - name: Validate Plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          ./pluginval --strictness-level 5 --validate-in-process --output-dir . --vst3 build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3

      - name: Validate Plugin (macOS)
        if: runner.os == 'macOS'
        run: |
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --output-dir . --vst3 build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3

      - name: Validate Plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\pluginval.exe --strictness-level 5 --validate-in-process --output-dir . --vst3 build\src\NineStrip_artefacts\Release\VST3\NineStrip.vst3

      # Upload logs
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log-${{ matrix.name }}
          path: "*.txt"

      # Package Linux
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p NineStrip
          cp -r build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 NineStrip/
          cp -r build/src/NineStrip_artefacts/Release/LV2/NineStrip.lv2 NineStrip/
          cp build/src/NineStrip_artefacts/Release/Standalone/NineStrip NineStrip/
          cp doc/NineStrip_Manual.pdf NineStrip/
          tar -czf ${{ matrix.artifact }} NineStrip

      # Package macOS
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p NineStrip
          cp -r build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 NineStrip/
          cp -r build/src/NineStrip_artefacts/Release/Standalone/NineStrip.app NineStrip/
          cp doc/NineStrip_Manual.pdf NineStrip/
          ditto -c -k --sequesterRsrc --keepParent NineStrip ${{ matrix.artifact }}

      # Package Windows
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path NineStrip
          Copy-Item -Recurse build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 NineStrip/
          Copy-Item build/src/NineStrip_artefacts/Release/Standalone/NineStrip.exe NineStrip/
          Copy-Item doc/NineStrip_Manual.pdf NineStrip/
          Compress-Archive -Path NineStrip -DestinationPath ${{ matrix.artifact }}

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Linux/NineStrip-Linux.tar.gz
            macOS/NineStrip-macOS.zip
            Windows/NineStrip-Windows.zip
          body: |
            # NineStrip ${{ github.ref_name }}

            ## Downloads
            - **Linux**: NineStrip-Linux.tar.gz
            - **macOS**: NineStrip-macOS.zip
            - **Windows**: NineStrip-Windows.zip

            Each package includes:
            - NineStrip.vst3 plugin
            - NineStrip.lv2 plugin (Linux only)
            - NineStrip standalone application
            - User Manual (PDF)

            ## Installation
            See the included manual for installation instructions.

            ### macOS Security Note
            For unsigned builds, you may need to remove the quarantine flag:
            ```bash
            xattr -d -r com.apple.quarantine /path/to/NineStrip.vst3
            xattr -d -r com.apple.quarantine /path/to/NineStrip.app
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
