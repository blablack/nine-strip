name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-manual:
    name: Build Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended pandoc fonts-liberation librsvg2-bin

      - name: Build manual
        run: |
          cd doc
          pandoc NineStrip_Manual.md -o NineStrip_Manual.pdf --pdf-engine=xelatex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: doc/NineStrip_Manual.pdf

  build:
    name: Build ${{ matrix.name }}
    needs: build-manual
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact: NineStrip-Linux.tar.gz
            cc: gcc
            cxx: g++

          - name: macOS
            os: macos-latest
            artifact: NineStrip-macOS.zip
            cc: clang
            cxx: clang++

          - name: Windows
            os: windows-latest
            artifact: NineStrip-Windows.zip
            cc: cl
            cxx: cl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download manual PDF
        uses: actions/download-artifact@v4
        with:
          name: manual-pdf
          path: doc/

      # Install Ninja (all platforms)
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            gcc \
            g++

      # Windows dependencies
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # CMake configuration
      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Build
      - name: Build
        run: ninja -C build

      # Run VST3 Validator
      - name: Download pluginval
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip pluginval_Linux.zip
          chmod +x pluginval

      - name: Download pluginval
        if: runner.os == 'macOS'
        run: |
          wget https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip pluginval_macOS.zip
          chmod +x pluginval.app/Contents/MacOS/pluginval

      - name: Download pluginval
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile "pluginval.zip"
          Expand-Archive -Path pluginval.zip -DestinationPath .

      # Validate with pluginval
      - name: Validate Plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb

          xvfb-run -a ./pluginval --strictness-level 4 --validate-in-process --output-dir . --vst3 build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3

      - name: Validate Plugin (macOS)
        if: runner.os == 'macOS'
        run: |
          # Validate VST3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --output-dir . --vst3 build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3

          # Install AU component so auval can find it
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -r build/src/NineStrip_artefacts/Release/AU/NineStrip.component ~/Library/Audio/Plug-Ins/Components/

          # Force macOS to re-scan the component registry
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2

          # Validate AU — args are: type subtype(PLUGIN_CODE) manufacturer(PLUGIN_MANUFACTURER_CODE)
          auval -v aufx NnSt No28

      - name: Validate Plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\pluginval.exe --strictness-level 5 --validate-in-process --output-dir . --vst3 build\src\NineStrip_artefacts\Release\VST3\NineStrip.vst3

      # Upload logs
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-log-${{ matrix.name }}
          path: "*.txt"

      # Package Linux
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p NineStrip
          cp -r build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 NineStrip/
          cp -r build/src/NineStrip_artefacts/Release/LV2/NineStrip.lv2 NineStrip/
          cp build/src/NineStrip_artefacts/Release/Standalone/NineStrip NineStrip/
          cp doc/NineStrip_Manual.pdf NineStrip/
          tar -czf ${{ matrix.artifact }} NineStrip

      # Package macOS
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p NineStrip
          cp -r build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 NineStrip/
          cp -r build/src/NineStrip_artefacts/Release/AU/NineStrip.component NineStrip/   
          cp -r build/src/NineStrip_artefacts/Release/Standalone/NineStrip.app NineStrip/
          cp doc/NineStrip_Manual.pdf NineStrip/
          ditto -c -k --sequesterRsrc --keepParent NineStrip ${{ matrix.artifact }}

      # Package Windows
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path NineStrip
          Copy-Item -Recurse build/src/NineStrip_artefacts/Release/VST3/NineStrip.vst3 NineStrip/
          Copy-Item build/src/NineStrip_artefacts/Release/Standalone/NineStrip.exe NineStrip/
          Copy-Item doc/NineStrip_Manual.pdf NineStrip/
          Compress-Archive -Path NineStrip -DestinationPath ${{ matrix.artifact }}

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Extract release notes
        run: |
          VERSION=${GITHUB_REF_NAME}
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')
          awk "
            /^## \[${ESCAPED_VERSION}\]/ { found=1; next }
            found && /^## \[/            { exit }
            found                        { print }
          " CHANGELOG.md > RELEASE_NOTES.md

          cat >> RELEASE_NOTES.md << 'EOF'

          ### macOS Security Note
          For unsigned builds, you may need to remove the quarantine flag:
          ```bash
          xattr -d -r com.apple.quarantine /path/to/NineStrip.vst3
          xattr -d -r com.apple.quarantine /path/to/NineStrip.component
          xattr -d -r com.apple.quarantine /path/to/NineStrip.app
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            Linux/NineStrip-Linux.tar.gz
            macOS/NineStrip-macOS.zip
            Windows/NineStrip-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
